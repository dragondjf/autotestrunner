# ============================================================
# AutoTest Runner 绿色便携版打包（nodejs-green-packager 技能落地）
#   触发: 推送 v* 标签 / 手动触发
#   产物: AutoTestRunner_{arch}_{os}_{时间戳}_{commit}.zip × 3 平台
#         win-x64 / linux-x64 / linux-arm64
#   内容: node/ + app/(源码+依赖+tsx) + browsers/(playwright chromium)
#         + data/ + 启停脚本 + README.txt
#   打包逻辑复用仓库自身脚本 scripts/package.sh + package-zip.sh
#   （与本地 make zip 完全同构，含 pnpm 链接重建与浏览器版本对齐）
# ============================================================
name: Package Green Version

on:
  push:
    tags:
      - 'v*'              # 推送 v1.0.0 等标签时触发
  workflow_dispatch:      # 支持手动触发

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        # dangerously-allow-all-builds 必带: pnpm 10 默认拦截依赖构建脚本,
        # better-sqlite3 的原生 binding 不会编译(仅 prebuild-install 也被拦),
        # 打出的包 web-ui 一开数据库即崩("Could not locate the bindings file")
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Verify native bindings
        # 打包前就地验证原生模块已编译, 防止缺 binding 的包溜进 Release
        # shell: bash 必须显式指定 —— Windows 默认 pwsh 会把多行 bash 拆碎,
        # 且 find 会解析到 Windows find.exe (File not found)
        shell: bash
        run: |
          test -n "$(find node_modules/.pnpm -path '*better-sqlite3*' -name 'better_sqlite3.node' -print -quit)" \
            || { echo '!! better_sqlite3.node 未编译 (pnpm 10 build scripts 被拦截?)'; exit 1; }
          echo "native binding OK"

      - name: Install Playwright chromium (含 Linux 系统依赖)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @brickcore/smartbrowser exec playwright install chromium
          pnpm --filter @brickcore/smartbrowser exec playwright install-deps chromium

      - name: Install Playwright chromium
        if: runner.os != 'Linux'
        run: pnpm --filter @brickcore/smartbrowser exec playwright install chromium

      - name: Build green package
        run: bash scripts/package.sh

      - name: Zip package
        run: bash scripts/package-zip.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoTestRunner-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach zips to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
